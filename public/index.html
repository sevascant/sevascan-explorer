<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevascan (SEV) Blockchain Explorer</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 900px; margin: auto; border: 1px solid #30363d; padding: 20px; border-radius: 6px; background: #0d1117; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; font-size: 22px; }
        .badge-ok { background: #238636; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .badge-wait { background: #9e6a00; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .stat-card { background: #161b22; padding: 15px; border-radius: 6px; margin: 20px 0; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #30363d; text-align: left; }
        th { color: #58a6ff; background: #1f242c; }
        .hash-cell { color: #79c0ff; word-break: break-all; }
        h3 { color: #58a6ff; margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 SEVASAN (SEV) BLOCKCHAIN EXPLORER</h1>

        <div class="stat-card">
            <h3>Altura de Red: <span id="block-height">Cargando...</span></h3>
            <p>Estado: <span id="net-status" class="badge-wait">CONECTANDO...</span></p>
            <p>Dificultad: <strong id="net-diff">-</strong> | Nodos conectados: <strong id="net-peers">0</strong></p>
        </div>

        <div class="stat-card">
            <h3>🧱 Últimos Bloques Minados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Bloque</th>
                        <th>Hash del Bloque</th>
                        <th>Txs</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="blocks-table">
                    <tr><td colspan="4">Cargando bloques...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function checkNode() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) throw new Error();
                const data = await res.json();
                if (!data.success) throw new Error();

                document.getElementById('block-height').innerText = `Block #${data.blocks}`;
                const statusEl = document.getElementById('net-status');
                statusEl.innerText = 'MAINNET ACTIVE (SHA3-256 + SCRYPT)';
                statusEl.className = 'badge-ok';
                document.getElementById('net-diff').innerText = data.difficulty;
                document.getElementById('net-peers').innerText = data.connections;

                const tbody = document.getElementById('blocks-table');
                tbody.innerHTML = data.latestBlocks.map(b => {
                    const dateStr = new Date(b.time * 1000).toLocaleTimeString();
                    return `<tr>
                        <td><strong>#${b.height}</strong></td>
                        <td class="hash-cell">${b.hash}</td>
                        <td>${b.txCount}</td>
                        <td>${dateStr}</td>
                    </tr>`;
                }).join('');
            } catch {
                document.getElementById('block-height').innerText = "Error de conexión";
            }
        }
        checkNode();
        setInterval(checkNode, 5000);
    </script>
</body>
</html>
